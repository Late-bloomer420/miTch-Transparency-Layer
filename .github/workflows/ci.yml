name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, Unit Tests, Schema Validation & Release Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check page-observer.js
          node --check domain-boundary.js
          node --check proof-bridge.js
          node --check surface-receipt.js
          node --check i18n.js
          node --check comparison-store.js
          node --check receipt-validator.js
          node --check receipt-diff.js
          node --check popup.js
          node --check build-meta.js
          node --check cli/mitch-scan.mjs
          node --check scripts/build-release.mjs

      - name: Run deterministic unit tests
        run: node --test test/*.test.mjs

      - name: Validate canonical Surface Receipt v1 fixtures via CLI
        run: |
          node cli/mitch-scan.mjs validate fixtures/receipts/allowed.json
          node cli/mitch-scan.mjs validate fixtures/receipts/limited.json
          node cli/mitch-scan.mjs validate fixtures/receipts/high-surface.json
          node cli/mitch-scan.mjs validate fixtures/receipts/unavailable.json

      - name: Verify release package integrity
        run: node scripts/build-release.mjs --verify
